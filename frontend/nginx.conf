server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Room for a 5 MB image plus multipart overhead.
    client_max_body_size 6m;

    # The API is served from the same origin, so the browser needs no CORS.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/destination/:id, /admin/users) fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
